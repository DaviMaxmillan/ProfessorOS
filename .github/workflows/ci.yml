name: CI

on:
  push:
    branches: [main]
  pull_request:

# Uma execução por branch: um push novo cancela a anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacao:
    name: Lint, tipos e testes unitários
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `prisma generate` roda no postinstall e é necessário para o typecheck.
      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

  e2e:
    name: Testes de ponta a ponta
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: professoros_test
        ports:
          - 5432:5432
        # pg_isready sem -U usa o usuário do sistema (root no runner), que não
        # existe no banco: o healthcheck falharia sempre e o job abortaria antes
        # de rodar qualquer teste.
        options: >-
          --health-cmd "pg_isready -U postgres -d professoros_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Sem NODE_ENV=production aqui: com essa variavel o `npm ci` pula as
    # devDependencies, e tanto o prisma (usado pelo postinstall) quanto o
    # playwright estao la. O `next build` ja constroi em modo producao por
    # conta propria.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/professoros_test?schema=public
      AUTH_SECRET: segredo-de-ci-com-mais-de-32-caracteres-aqui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Preparar o banco
        run: npx prisma db push --skip-generate

      - name: Build de produção
        run: npm run build

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        run: npm run test:e2e

      # O trace só é gerado quando um teste falha (trace: 'retain-on-failure').
      - name: Guardar o relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
